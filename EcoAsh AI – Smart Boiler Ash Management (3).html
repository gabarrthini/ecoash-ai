<script>

 {id:'P2',code:'NCT',name:'North Chennai TPS',loc:'Chennai, TN',cap:3000,level:35,temp:44,dust:55,load:900,src:'none',last:null,hist:[]}],
 buyers:[{id:'B1',org:'UltraBlend Cement Pvt Ltd',contact:'ops@ultrablend.example',status:'Approved',reqs:[{id:'R1',type:'Fly Ash',app:'Cement / concrete blending',qty:300,maxLOI:6,minSi:50}]},
 {id:'B2',org:'GreenBrick Works',contact:'info@greenbrick.example',status:'Pending',reqs:[]}],
 batches:[
 {id:'ASH-TNP-20261110-001',plant:'P1',type:'Fly Ash',qty:500,date:'2026-11-10',store:'Silo A',av:500,rs:0,dp:0,dl:0,ru:0,di:0,lab:{si:55,al:27,fe:6,ca:3,loi:3.5,mo:.5,status:'Approved',remark:'Within limits',file:''},hist:[{t:'2026-11-10',e:'Batch created'},{t:'2026-11-11',e:'Lab approved'}]},
 {id:'ASH-TNP-20261118-002',plant:'P1',type:'Bottom Ash',qty:200,date:'2026-11-18',store:'Bunker 2',av:200,rs:0,dp:0,dl:0,ru:0,di:0,lab:{si:48,al:20,fe:9,ca:2,loi:9,mo:4,status:'Submitted',remark:'',file:''},hist:[{t:'2026-11-18',e:'Batch created'},{t:'2026-11-19',e:'Lab submitted'}]},
 {id:'ASH-NCT-20261120-001',plant:'P2',type:'Fly Ash',qty:400,date:'2026-11-20',store:'Silo C',av:400,rs:0,dp:0,dl:0,ru:0,di:0,lab:null,hist:[{t:'2026-11-20',e:'Batch created'}]}],

const C=(l,v,u)=>`<div class=cd><small>${l}</small><b>${v}</b> ${u||''}</div>`;
const fld=(l,n,t,x)=>`<label>${l}<input name=${n} type=${t||'text'} ${x||''} required></label>`;
const sel_=(l,n,o)=>`<label>${l}<select name=${n}>${o.map(x=>`<option>${E(x)}</option>`).join('')}</select></label>`;
function toast(m,er){const t=$('#toast');t.textContent=m;t.style.background=er?'var(--rd)':'var(--gr)';t.style.color=er?'#fff':'#04110a';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function go(fn){try{const m=fn();save();toast(m||'Done')}catch(e){toast(e.message,1)}render()}
const F=(e,fn,...a)=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));go(()=>API[fn](...a,o));return false};
const B=(fn,...a)=>go(()=>API[fn](...a));
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type||'text/csv'}));a.download=name;a.click()}
const csv=(name,rows)=>dl(name,rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'));
/* ---------- permission-checked data layer (swap for a server API later) ---------- */
function g(roles,owner){if(!sess||!roles.includes(sess.role))throw Error('Permission denied for role: '+(sess?sess.role:'none'));if(sess.role!=='admin'&&owner!==undefined&&sess.id!==owner)throw Error('Permission denied: not your record')}
const num=(v,lo,hi,l)=>{v=+v;if(!isFinite(v)||v<lo||v>hi)throw Error(l+' must be between '+lo+' and '+hi);return v};
const need=(v,l)=>{v=String(v||'').trim();if(!v)throw Error(l+' is required');return v};
function match(b,r){const l=b.lab;if(!l)return null;const c=[[`Type: ${r.type}`,b.type===r.type],...APPS[r.app].c.map(([t,f])=>[t,f(l)]),[`LOI ≤ ${r.maxLOI}% (buyer)`,l.loi<=r.maxLOI],[`SiO2 ≥ ${r.minSi}% (buyer)`,l.si>=r.minSi],[`Available ≥ ${r.qty} t`,b.av>=r.qty]];
 return{score:Math.round(c.filter(x=>x[1]).length/c.length*100),why:c,verified:l.status==='Approved'}}
const API={
 registerBuyer(o){const org=need(o.org,'Organization');need(o.contact,'Contact');if(S.auth[o.contact.trim().toLowerCase()])throw Error('That username (email) is already in use');if(S.buyers.some(b=>b.org.toLowerCase()===org.toLowerCase()))throw Error('Organization already registered');const id='B'+S.seq.b++;S.auth[o.contact.trim().toLowerCase()]={role:'buyer',id,...o.a};S.buyers.push({id,org,contact:o.contact,status:'Pending',reqs:[]});note('admin','New buyer registration: '+org);return 'Request submitted to the admin team. Sign in after approval.'},
 registerPlant(o){const adm=sess&&sess.role==='admin';if(sess&&!adm)throw Error('Permission denied');const code=need(o.code,'Code').toUpperCase();if(S.plants.some(p=>p.code===code)||S.auth[code.toLowerCase()])throw Error('Plant code / username exists');const cap=num(o.cap,1,1e6,'Capacity'),name=need(o.name,'Name'),loc=need(o.loc,'Location');const pid='P'+S.seq.p++;S.auth[code.toLowerCase()]={role:'plant',id:pid,...o.a};S.plants.push({id:pid,code,status:adm?'Approved':'Pending',name,loc,cap,level:0,temp:0,dust:0,load:0,src:'none',last:null,hist:[]});if(adm)return 'Plant added';note('admin','New thermal plant registration request: '+name);return 'Request submitted to the admin team. Your username is '+code.toLowerCase()+'. Sign in after approval.'},
 decidePlant(id,ok){g(['admin']);const p=P(id);p.status=ok?'Approved':'Rejected';note('plant:'+id,'Registration '+p.status.toLowerCase());return p.name+' '+p.status},
 decideBuyer(id,ok){g(['admin']);const b=Bu(id);b.status=ok?'Approved':'Rejected';note('buyer:'+id,'Registration '+b.status.toLowerCase());return b.org+' '+b.status},
 createBatch(pid,o){g(['plant','admin'],pid);const p=P(pid),q=num(o.qty,.1,1e6,'Quantity');if(!['Fly Ash','Bottom Ash'].includes(o.type))throw Error('Invalid ash type');need(o.date,'Date');const d=o.date.replace(/-/g,'');
  let k=1,id;do id=`ASH-${p.code}-${d}-${String(k++).padStart(3,'0')}`;while(Ba(id));S.batches.push({id,plant:pid,type:o.type,qty:q,date:o.date,store:need(o.store,'Storage location'),av:q,rs:0,dp:0,dl:0,ru:0,di:0,lab:null,hist:[]});log(Ba(id),'Batch created');note('admin','Batch '+id+' created by '+p.name);return 'Batch '+id+' created'},
 submitLab(id,o){const b=Ba(id);g(['plant','admin'],b.plant);if(b.lab&&b.lab.status==='Approved')throw Error('Lab already approved');const l={status:'Submitted',remark:'',file:o.file||''};['si','al','fe','ca','loi','mo'].forEach(k=>l[k]=num(o[k],0,100,k.toUpperCase()));if(l.si+l.al+l.fe+l.ca>100)throw Error('Oxide total exceeds 100%');b.lab=l;log(b,'Lab report submitted');note('admin','Lab report awaiting verification: '+id);return 'Lab report linked to '+id},
 verifyLab(id,ok,o){g(['admin']);const b=Ba(id);if(!b.lab||b.lab.status!=='Submitted')throw Error('No submitted report');if(!ok&&!String(o.remark||'').trim())throw Error('Remarks required to reject');b.lab.status=ok?'Approved':'Rejected';b.lab.remark=o.remark||'';log(b,'Lab '+b.lab.status.toLowerCase());note('plant:'+b.plant,`Lab report for ${id} ${b.lab.status.toLowerCase()}`);return 'Report '+b.lab.status},
 addReq(bid,o){g(['buyer','admin'],bid);const b=Bu(bid);if(b.status!=='Approved')throw Error('Registration not approved');if(!APPS[o.app])throw Error('Invalid application');b.reqs.push({id:'R'+S.seq.r++,type:o.type,app:o.app,qty:num(o.qty,1,1e6,'Monthly demand'),maxLOI:num(o.maxLOI,0,100,'Max LOI'),minSi:num(o.minSi,0,100,'Min SiO2')});return 'Requirement saved'},
 placeOrder(bid,o){g(['buyer','admin'],bid);const bu=Bu(bid);if(bu.status!=='Approved')throw Error('Registration not approved');const b=Ba(o.batch);if(!b.lab||b.lab.status!=='Approved')throw Error('Batch not lab-verified');const q=num(o.qty,.1,1e6,'Quantity');if(q>b.av)throw Error('Only '+n1(b.av)+' t available');
  if(S.orders.some(x=>x.buyer===bid&&x.batch===b.id&&x.status==='Requested'))throw Error('Duplicate: a pending request for this batch exists');const id='ORD-'+String(S.seq.o++).padStart(4,'0');S.orders.push({id,batch:b.id,buyer:bid,qty:q,status:'Requested',at:new Date().toISOString()});log(b,`Order ${id} requested (${q} t)`);note('admin',`New request ${id}: ${bu.org} → ${b.id}`);return 'Request '+id+' submitted'},
 decideOrder(id,ok){g(['admin']);const o=Or(id),b=Ba(o.batch);if(o.status!=='Requested')throw Error('Already decided');if(ok){if(o.qty>b.av)throw Error('Overbooking blocked: only '+n1(b.av)+' t available');b.av-=o.qty;b.rs+=o.qty;o.status='Approved'}else o.status='Rejected';log(b,`Order ${id} ${o.status.toLowerCase()}`);note('buyer:'+o.buyer,`Order ${id} ${o.status.toLowerCase()}`);if(ok)note('plant:'+b.plant,`${o.qty} t of ${b.id} reserved (${id})`);return id+' '+o.status},
 schedule(id,o){g(['admin']);const x=Or(id);if(x.status!=='Approved')throw Error('Order must be approved');x.transporter=need(o.transporter,'Transporter');x.vehicle=o.vehicle||'';x.pickup=need(o.pickup,'Pickup date');x.status='Scheduled';const b=Ba(x.batch);log(b,`Pickup scheduled ${x.pickup} (${x.transporter})`);note('plant:'+b.plant,`Collection ${id} on ${x.pickup}, ${x.transporter}`);note('buyer:'+x.buyer,`Pickup for ${id} scheduled ${x.pickup}`);return 'Scheduled'},
 dispatch(id){const x=Or(id),b=Ba(x.batch);g(['plant','admin'],b.plant);if(x.status!=='Scheduled')throw Error('Order not scheduled');b.rs-=x.qty;b.dp+=x.qty;x.status='Dispatched';log(b,`Dispatched ${x.qty} t (${id})`);note('buyer:'+x.buyer,`${id} dispatched`);note('admin',`${id} dispatched`);return 'Dispatch confirmed'},
 receive(id,o){const x=Or(id);g(['buyer'],x.buyer);const b=Ba(x.batch);if(x.status!=='Dispatched')throw Error('Order not dispatched');const code=String(o.qr||'').trim().replace(/^ECOASH\|/,'');if(code!==b.id)throw Error('QR / Batch ID does not match this order');const r=num(o.recv,0,x.qty,'Received quantity');b.dp-=x.qty;b.dl+=r;b.av+=x.qty-r;x.recv=r;x.diff=+(x.qty-r).toFixed(2);x.status='Delivered';log(b,`Delivered ${r} t (diff ${x.diff} t)`);note('admin',`${id} received ${r} t, discrepancy ${x.diff} t`);note('plant:'+b.plant,`${id} delivered`);return 'Receipt confirmed'+(x.diff?' – discrepancy recorded':'')},
 finalize(id,o){g(['admin']);const x=Or(id),b=Ba(x.batch);if(x.status!=='Delivered')throw Error('Not delivered yet');const u=num(o.reused,0,x.recv,'Reused'),d=num(o.disposed,0,x.recv,'Disposed');if(+(u+d).toFixed(2)!==x.recv)throw Error('Reused + disposed must equal received ('+x.recv+' t)');b.dl-=x.recv;b.ru+=u;b.di+=d;x.ru=u;x.di=d;x.status='Closed';x.closed=new Date().toISOString();log(b,`Final: reused ${u} t, disposed ${d} t`);note('buyer:'+x.buyer,id+' closed');note('plant:'+b.plant,id+' closed');return 'Final utilization recorded'},
 reading(pid,o){g(['plant','admin'],pid);return AshAPI.ingestReading(pid,{loadcell_kg:o.load,ultrasonic_level_pct:o.level,temp_c:o.temp,dust_ugm3:o.dust},'MANUAL')},
 notify(o){g(['admin']);note(o.to,need(o.msg,'Message'));return 'Notification sent'},
 reset(){S=seed();sess=null;initAuth().then(()=>{save();render()});return 'Demo data reset – sign in again'}};
/* ---------- replaceable sensor layer: ESP32 will call ingestReading(plantId, payload, 'ESP32') ---------- */
const AshAPI=window.AshAPI={ingestReading(pid,r,src){const p=P(pid);const v={load:num(r.loadcell_kg,0,1e7,'Weight'),level:num(r.ultrasonic_level_pct,0,100,'Level'),temp:num(r.temp_c,-40,1000,'Temperature'),dust:num(r.dust_ugm3,0,1e5,'Dust')};
 Object.assign(p,v,{src,last:Date.now()});p.hist.unshift({t:new Date().toLocaleTimeString(),src,...v});p.hist.length=Math.min(p.hist.length,40);
 const al=[];if(v.level>=85)al.push('silo level '+v.level+'%');if(v.temp>=85)al.push('temperature '+v.temp+'°C');if(v.dust>=150)al.push('dust '+v.dust+' µg/m³');
 if(al.length){const m=`ALERT ${p.name}: ${al.join(', ')}`+(src==='DEMO'?' [DEMO]':'');note('plant:'+pid,m);note('admin',m)}return 'Reading recorded ('+src+')'}};
setInterval(()=>{if(!simOn||!sess||!sel)return;const p=P(sel);if(!p)return;const d=(x,a,lo,hi)=>Math.min(hi,Math.max(lo,x+(Math.random()-.4)*a));
 try{AshAPI.ingestReading(p.id,{loadcell_kg:d(p.load,40,0,5e4),ultrasonic_level_pct:d(p.level,3,0,100),temp_c:d(p.temp,4,20,120),dust_ugm3:d(p.dust,12,0,400)},'DEMO');save();if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#md').style.display.includes('flex'))render()}catch(e){}},4000);
/* ---------- views ---------- */
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const mk=async pw=>{const salt=crypto.randomUUID();return{salt,hash:await sha(salt+pw)}};
async function initAuth(){S.auth={};const a=async(u,r,id,pw)=>{S.auth[u]={role:r,id,...await mk(pw)}};await a('admin','admin','ADMIN','Admin@123');await a('tnp','plant','P1','Plant1@123');await a('nct','plant','P2','Plant2@123');await a('ops@ultrablend.example','buyer','B1','Buyer1@123');await a('info@greenbrick.example','buyer','B2','Buyer2@123')}
async function RG(e,fn){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));try{if(o.pw.length<8)throw Error('Password must be at least 8 characters');if(o.pw!==o.pw2)throw Error('Passwords do not match');o.a=await mk(o.pw);delete o.pw;delete o.pw2}catch(x){toast(x.message,1);return false}go(()=>API[fn](o));return false}
const LK={};let LR=null,RT='buyer';const RN={plant:'Thermal Plant',admin:'Waste Management Industry (Admin)',buyer:'Buyer'};const setLR=r=>{LR=r;render();setTimeout(toLogin,0)},setRT=r=>{RT=r;render();setTimeout(()=>$('#reg').scrollIntoView(),0)};
async function L(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),u=o.user.trim().toLowerCase(),now=Date.now(),k=LK[u]||{n:0,t:0};
 if(k.t>now){toast('Too many attempts. Try again in '+Math.ceil((k.t-now)/1000)+'s',1);return false}
 if(!LR){toast('Choose who you are first',1);return false}

function matchV(){const rows=[];S.buyers.filter(b=>b.status==='Approved').forEach(b=>b.reqs.forEach(r=>S.batches.forEach(x=>{const m=match(x,r);if(m)rows.push([b.org,r.app+' ('+r.type+')',x.id,m.score,m.verified])})));rows.sort((a,b)=>b[3]-a[3]);
 return`<h3>AI potential-match recommendations (buyer needs × batches)</h3>`+T(['Buyer','Requirement','Batch','Match','Basis'],rows.slice(0,15).map(r=>[E(r[0]),E(r[1]),r[2],r[3]+'%',r[4]?bd('Verified lab','ok'):bd('POTENTIAL – lab unverified','wa')]))}
function labV(){const L=S.batches.filter(b=>b.lab);return`<h2>Laboratory verification</h2>`+T(['Batch','Plant','SiO2','Al2O3','Fe2O3','CaO','LOI','Moist.','File','Status','Decision'],L.map(b=>{const l=b.lab;return[b.id,E(P(b.plant).code),l.si,l.al,l.fe,l.ca,l.loi,l.mo,E(l.file||'–'),sb(l.status)+(l.remark?'<br><small>'+E(l.remark)+'</small>':''),l.status==='Submitted'?`<form onsubmit="return F(event,'verifyLab','${b.id}',this.ok.value==='1')"><div class=row><input name=remark placeholder="Remarks"><select name=ok><option value=1>Approve</option><option value=0>Reject</option></select><button class=b>Save</button></div></form>`:(l.status==='Approved'?`<button class="b s" onclick="cert('${b.id}')">Certificate</button>`:'')]}))}
function analytics(){const bt=S.batches,mo={};S.orders.filter(o=>o.status==='Closed').forEach(o=>{const k=o.closed.slice(0,7);mo[k]=mo[k]||[0,0];mo[k][0]+=o.ru;mo[k][1]+=o.di});const mx=Math.max(1,...S.plants.map(p=>sum(bt.filter(b=>b.plant===p.id),'qty')));
 return`<h2>Analytics and reports</h2><div class="row noprint"><button class=b onclick="exp()">Download CSV</button><button class="b s" onclick="print()">Print / save as PDF</button></div>
 <h3>Plant-wise generation (t)</h3>${S.plants.map(p=>{const v=sum(bt.filter(b=>b.plant===p.id),'qty');return`<div>${E(p.name)} – ${n1(v)}<div class=bar><i style="width:${v/mx*100}%"></i></div></div>`}).join('')}
 <h3>Reused vs disposed</h3><p>Reused ${n1(sum(bt,'ru'))} t · Disposed ${n1(sum(bt,'di'))} t</p><h3>Monthly utilization</h3>${T(['Month','Reused t','Disposed t'],Object.entries(mo).map(([k,v])=>[k,n1(v[0]),n1(v[1])]))}
 <h3>Buyer-wise demand and receipts</h3>${T(['Buyer','Demand t/month','Ordered t','Received t'],S.buyers.map(b=>{const o=S.orders.filter(x=>x.buyer===b.id);return[E(b.org),n1(sum(b.reqs,'qty')),n1(sum(o,'qty')),n1(sum(o,'recv'))]}))}
 <h3>Transport</h3>${T(['Order','Transporter','Pickup','Status','Diff t'],S.orders.filter(o=>o.transporter).map(o=>[o.id,E(o.transporter),o.pickup,o.status,o.diff??'–']))}
 <h3>Lab quality</h3>${T(['Batch','SiO2','LOI','Status'],bt.filter(b=>b.lab).map(b=>[b.id,b.lab.si,b.lab.loi,b.lab.status]))}`}
function exp(){csv('ecoash-batches.csv',[['Batch','Plant','Type','Qty','Available','Reserved','Dispatched','Delivered','Reused','Disposed','Lab']].concat(S.batches.map(b=>[b.id,P(b.plant).name,b.type,b.qty,b.av,b.rs,b.dp,b.dl,b.ru,b.di,b.lab?b.lab.status:'none'])))}
function notesV(to,lim){const L=S.notes.filter(n=>n.to===to).slice(0,lim||50);return(lim?'':'<h2>Notifications</h2>')+T(['Time','Message'],L.map(n=>[new Date(n.t).toLocaleString(),E(n.msg)]))}
function notifyForm(){return`<h3>Send notification</h3><form onsubmit="return F(event,'notify')"><div class=row><label>To<select name=to>${S.plants.map(p=>`<option value="plant:${p.id}">${E(p.name)}</option>`).join('')}${S.buyers.map(b=>`<option value="buyer:${b.id}">${E(b.org)}</option>`).join('')}</select></label>${fld('Message','msg','text','style="min-width:260px"')}<button class=b>Send</button></div></form>`}
render();if(!S.auth)initAuth().then(save);
</script></body></html>
