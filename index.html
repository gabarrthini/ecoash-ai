<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoAsh AI – Smart Boiler Ash Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d1210;--pn:#151c18;--ln:#26332b;--tx:#e6efe9;--mt:#8fa397;--gr:#22c55e;--am:#f59e0b;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:auto;margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--pn);flex-wrap:wrap}
header h1{font-size:18px;margin:0;color:var(--gr)}header .sp{flex:1}
.wrap{display:flex;min-height:calc(100vh - 56px)}nav{width:190px;border-right:1px solid var(--ln);background:var(--pn);padding:10px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;margin:2px 0;background:none;border:0;color:var(--mt);padding:9px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on,nav button:hover{background:#1d2a23;color:var(--gr)}main{flex:1;padding:16px;min-width:0}
h2{margin:0 0 12px;font-size:18px}h3{margin:18px 0 8px;font-size:15px;color:var(--gr)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.cd,.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px}.cd small{color:var(--mt);display:block}.cd b{font-size:22px}
.pn{margin-bottom:12px}.sc{overflow-x:auto;margin-bottom:10px}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mt);font-weight:600;font-size:12px}
.mt{color:var(--mt)}input,select,textarea{background:#0b100d;border:1px solid var(--ln);color:var(--tx);padding:7px;border-radius:6px;font:inherit;max-width:100%}
button.b{background:var(--gr);color:#04110a;border:0;padding:7px 12px;border-radius:6px;font-weight:600;cursor:pointer}button.b.s{background:#24322a;color:var(--tx)}button.b.d{background:var(--rd);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:6px 0}.row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mt)}
.bd{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#24322a;color:var(--tx);white-space:nowrap}.bd.ok{background:#14532d;color:#bbf7d0}.bd.wa{background:#78350f;color:#fde68a}.bd.er{background:#7f1d1d;color:#fecaca}
.demo{background:#78350f;color:#fde68a;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}#md .in{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:18px;max-width:640px;width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;display:none;z-index:30;font-weight:600}
.bar{height:10px;background:#0b100d;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
details summary{cursor:pointer;color:var(--mt)}code,pre{background:#0b100d;padding:2px 5px;border-radius:4px;font-size:12px;white-space:pre-wrap}
@media(max-width:720px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln)}nav button{white-space:nowrap;width:auto}}
@media print{nav,header button,.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head><body>
<div id="app"></div><div id="md"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=x=>(Math.round((+x||0)*10)/10).toLocaleString();
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const KEY='ecoash_v1';
const seed=()=>({plants:[
 {id:'P1',code:'TNP',name:'Tuticorin Thermal Plant',loc:'Thoothukudi, TN',cap:2000,level:62,temp:48,dust:70,load:1240,src:'none',last:null,hist:[]},
 {id:'P2',code:'NCT',name:'North Chennai TPS',loc:'Chennai, TN',cap:3000,level:35,temp:44,dust:55,load:900,src:'none',last:null,hist:[]}],
 buyers:[{id:'B1',org:'UltraBlend Cement Pvt Ltd',contact:'ops@ultrablend.example',status:'Approved',reqs:[{id:'R1',type:'Fly Ash',app:'Cement / concrete blending',qty:300,maxLOI:6,minSi:50}]},
 {id:'B2',org:'GreenBrick Works',contact:'info@greenbrick.example',status:'Pending',reqs:[]}],
 batches:[
 {id:'ASH-TNP-20261110-001',plant:'P1',type:'Fly Ash',qty:500,date:'2026-11-10',store:'Silo A',av:500,rs:0,dp:0,dl:0,ru:0,di:0,lab:{si:55,al:27,fe:6,ca:3,loi:3.5,mo:.5,status:'Approved',remark:'Within limits',file:''},hist:[{t:'2026-11-10',e:'Batch created'},{t:'2026-11-11',e:'Lab approved'}]},
 {id:'ASH-TNP-20261118-002',plant:'P1',type:'Bottom Ash',qty:200,date:'2026-11-18',store:'Bunker 2',av:200,rs:0,dp:0,dl:0,ru:0,di:0,lab:{si:48,al:20,fe:9,ca:2,loi:9,mo:4,status:'Submitted',remark:'',file:''},hist:[{t:'2026-11-18',e:'Batch created'},{t:'2026-11-19',e:'Lab submitted'}]},
 {id:'ASH-NCT-20261120-001',plant:'P2',type:'Fly Ash',qty:400,date:'2026-11-20',store:'Silo C',av:400,rs:0,dp:0,dl:0,ru:0,di:0,lab:null,hist:[{t:'2026-11-20',e:'Batch created'}]}],
 orders:[],notes:[{id:1,to:'admin',t:new Date().toISOString(),msg:'Sample data loaded: 2 plants, 2 buyers (1 pending approval), 3 batches.'}],seq:{o:1,n:2,r:2,p:3,b:3}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let sess=null,tab='',sel=null,cmp=[],simOn=false;
const TABS={plant:['Dashboard','Batches','Collections','Notifications'],admin:['Overview','Plants','Buyers','Batches','Lab Verification','Marketplace & AI Match','Orders & Transport','Analytics','Notifications'],buyer:['Profile & Needs','Marketplace','My Orders','Notifications']};
const APPS={'Cement / concrete blending':{c:[['SiO2+Al2O3+Fe2O3 ≥ 70%',l=>l.si+l.al+l.fe>=70],['LOI ≤ 6%',l=>l.loi<=6],['Moisture ≤ 3%',l=>l.mo<=3]]},
'Brick / block making':{c:[['SiO2+Al2O3 ≥ 50%',l=>l.si+l.al>=50],['LOI ≤ 12%',l=>l.loi<=12],['Moisture ≤ 5%',l=>l.mo<=5]]},
'Geopolymer / concrete binder':{c:[['SiO2+Al2O3 ≥ 60%',l=>l.si+l.al>=60],['CaO ≤ 10%',l=>l.ca<=10],['LOI ≤ 8%',l=>l.loi<=8]]},
'Road embankment / fill':{c:[['LOI ≤ 15%',l=>l.loi<=15],['Moisture ≤ 10%',l=>l.mo<=10]]},
'Lightweight aggregate':{c:[['LOI ≤ 10%',l=>l.loi<=10],['Fe2O3 ≤ 15%',l=>l.fe<=15]]}};
/* ---------- helpers ---------- */
const P=id=>S.plants.find(p=>p.id===id),Bu=id=>S.buyers.find(b=>b.id===id),Ba=id=>S.batches.find(b=>b.id===id),Or=id=>S.orders.find(o=>o.id===id);
const note=(to,msg)=>S.notes.unshift({id:S.seq.n++,to,t:new Date().toISOString(),msg});
const log=(b,e)=>b.hist.push({t:new Date().toISOString().slice(0,16).replace('T',' '),e});
const bd=(t,c)=>`<span class="bd ${c||''}">${E(t)}</span>`;
const ST={Requested:'wa',Approved:'ok',Rejected:'er',Scheduled:'wa',Dispatched:'wa',Delivered:'ok',Closed:'ok',Pending:'wa',Submitted:'wa'};
const sb=s=>bd(s,ST[s]);
const T=(h,r)=>`<div class=sc><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${h.length} class=mt>No records</td></tr>`}</table></div>`;
const C=(l,v,u)=>`<div class=cd><small>${l}</small><b>${v}</b> ${u||''}</div>`;
const fld=(l,n,t,x)=>`<label>${l}<input name=${n} type=${t||'text'} ${x||''} required></label>`;
const sel_=(l,n,o)=>`<label>${l}<select name=${n}>${o.map(x=>`<option>${E(x)}</option>`).join('')}</select></label>`;
function toast(m,er){const t=$('#toast');t.textContent=m;t.style.background=er?'var(--rd)':'var(--gr)';t.style.color=er?'#fff':'#04110a';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function go(fn){try{const m=fn();save();toast(m||'Done')}catch(e){toast(e.message,1)}render()}
const F=(e,fn,...a)=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));go(()=>API[fn](...a,o));return false};
const B=(fn,...a)=>go(()=>API[fn](...a));
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type||'text/csv'}));a.download=name;a.click()}
const csv=(name,rows)=>dl(name,rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'));
/* ---------- permission-checked data layer (swap for a server API later) ---------- */
function g(roles,owner){if(!sess||!roles.includes(sess.role))throw Error('Permission denied for role: '+(sess?sess.role:'none'));if(sess.role!=='admin'&&owner!==undefined&&sess.id!==owner)throw Error('Permission denied: not your record')}
const num=(v,lo,hi,l)=>{v=+v;if(!isFinite(v)||v<lo||v>hi)throw Error(l+' must be between '+lo+' and '+hi);return v};
const need=(v,l)=>{v=String(v||'').trim();if(!v)throw Error(l+' is required');return v};
function match(b,r){const l=b.lab;if(!l)return null;const c=[[`Type: ${r.type}`,b.type===r.type],...APPS[r.app].c.map(([t,f])=>[t,f(l)]),[`LOI ≤ ${r.maxLOI}% (buyer)`,l.loi<=r.maxLOI],[`SiO2 ≥ ${r.minSi}% (buyer)`,l.si>=r.minSi],[`Available ≥ ${r.qty} t`,b.av>=r.qty]];
 return{score:Math.round(c.filter(x=>x[1]).length/c.length*100),why:c,verified:l.status==='Approved'}}
const API={
 registerBuyer(o){const org=need(o.org,'Organization');need(o.contact,'Contact');if(S.buyers.some(b=>b.org.toLowerCase()===org.toLowerCase()))throw Error('Organization already registered');const id='B'+S.seq.b++;S.buyers.push({id,org,contact:o.contact,status:'Pending',reqs:[]});note('admin','New buyer registration: '+org);return 'Registered. Awaiting administrator approval.'},
 registerPlant(o){g(['admin']);const code=need(o.code,'Code').toUpperCase();if(S.plants.some(p=>p.code===code))throw Error('Plant code exists');S.plants.push({id:'P'+S.seq.p++,code,name:need(o.name,'Name'),loc:need(o.loc,'Location'),cap:num(o.cap,1,1e6,'Capacity'),level:0,temp:0,dust:0,load:0,src:'none',last:null,hist:[]});return 'Plant registered'},
 decideBuyer(id,ok){g(['admin']);const b=Bu(id);b.status=ok?'Approved':'Rejected';note('buyer:'+id,'Registration '+b.status.toLowerCase());return b.org+' '+b.status},
 createBatch(pid,o){g(['plant','admin'],pid);const p=P(pid),q=num(o.qty,.1,1e6,'Quantity');if(!['Fly Ash','Bottom Ash'].includes(o.type))throw Error('Invalid ash type');need(o.date,'Date');const d=o.date.replace(/-/g,'');
  let k=1,id;do id=`ASH-${p.code}-${d}-${String(k++).padStart(3,'0')}`;while(Ba(id));S.batches.push({id,plant:pid,type:o.type,qty:q,date:o.date,store:need(o.store,'Storage location'),av:q,rs:0,dp:0,dl:0,ru:0,di:0,lab:null,hist:[]});log(Ba(id),'Batch created');note('admin','Batch '+id+' created by '+p.name);return 'Batch '+id+' created'},
 submitLab(id,o){const b=Ba(id);g(['plant','admin'],b.plant);if(b.lab&&b.lab.status==='Approved')throw Error('Lab already approved');const l={status:'Submitted',remark:'',file:o.file||''};['si','al','fe','ca','loi','mo'].forEach(k=>l[k]=num(o[k],0,100,k.toUpperCase()));if(l.si+l.al+l.fe+l.ca>100)throw Error('Oxide total exceeds 100%');b.lab=l;log(b,'Lab report submitted');note('admin','Lab report awaiting verification: '+id);return 'Lab report linked to '+id},
 verifyLab(id,ok,o){g(['admin']);const b=Ba(id);if(!b.lab||b.lab.status!=='Submitted')throw Error('No submitted report');if(!ok&&!String(o.remark||'').trim())throw Error('Remarks required to reject');b.lab.status=ok?'Approved':'Rejected';b.lab.remark=o.remark||'';log(b,'Lab '+b.lab.status.toLowerCase());note('plant:'+b.plant,`Lab report for ${id} ${b.lab.status.toLowerCase()}`);return 'Report '+b.lab.status},
 addReq(bid,o){g(['buyer','admin'],bid);const b=Bu(bid);if(b.status!=='Approved')throw Error('Registration not approved');if(!APPS[o.app])throw Error('Invalid application');b.reqs.push({id:'R'+S.seq.r++,type:o.type,app:o.app,qty:num(o.qty,1,1e6,'Monthly demand'),maxLOI:num(o.maxLOI,0,100,'Max LOI'),minSi:num(o.minSi,0,100,'Min SiO2')});return 'Requirement saved'},
 placeOrder(bid,o){g(['buyer','admin'],bid);const bu=Bu(bid);if(bu.status!=='Approved')throw Error('Registration not approved');const b=Ba(o.batch);if(!b.lab||b.lab.status!=='Approved')throw Error('Batch not lab-verified');const q=num(o.qty,.1,1e6,'Quantity');if(q>b.av)throw Error('Only '+n1(b.av)+' t available');
  if(S.orders.some(x=>x.buyer===bid&&x.batch===b.id&&x.status==='Requested'))throw Error('Duplicate: a pending request for this batch exists');const id='ORD-'+String(S.seq.o++).padStart(4,'0');S.orders.push({id,batch:b.id,buyer:bid,qty:q,status:'Requested',at:new Date().toISOString()});log(b,`Order ${id} requested (${q} t)`);note('admin',`New request ${id}: ${bu.org} → ${b.id}`);return 'Request '+id+' submitted'},
 decideOrder(id,ok){g(['admin']);const o=Or(id),b=Ba(o.batch);if(o.status!=='Requested')throw Error('Already decided');if(ok){if(o.qty>b.av)throw Error('Overbooking blocked: only '+n1(b.av)+' t available');b.av-=o.qty;b.rs+=o.qty;o.status='Approved'}else o.status='Rejected';log(b,`Order ${id} ${o.status.toLowerCase()}`);note('buyer:'+o.buyer,`Order ${id} ${o.status.toLowerCase()}`);if(ok)note('plant:'+b.plant,`${o.qty} t of ${b.id} reserved (${id})`);return id+' '+o.status},
 schedule(id,o){g(['admin']);const x=Or(id);if(x.status!=='Approved')throw Error('Order must be approved');x.transporter=need(o.transporter,'Transporter');x.vehicle=o.vehicle||'';x.pickup=need(o.pickup,'Pickup date');x.status='Scheduled';const b=Ba(x.batch);log(b,`Pickup scheduled ${x.pickup} (${x.transporter})`);note('plant:'+b.plant,`Collection ${id} on ${x.pickup}, ${x.transporter}`);note('buyer:'+x.buyer,`Pickup for ${id} scheduled ${x.pickup}`);return 'Scheduled'},
 dispatch(id){const x=Or(id),b=Ba(x.batch);g(['plant','admin'],b.plant);if(x.status!=='Scheduled')throw Error('Order not scheduled');b.rs-=x.qty;b.dp+=x.qty;x.status='Dispatched';log(b,`Dispatched ${x.qty} t (${id})`);note('buyer:'+x.buyer,`${id} dispatched`);note('admin',`${id} dispatched`);return 'Dispatch confirmed'},
 receive(id,o){const x=Or(id);g(['buyer'],x.buyer);const b=Ba(x.batch);if(x.status!=='Dispatched')throw Error('Order not dispatched');const code=String(o.qr||'').trim().replace(/^ECOASH\|/,'');if(code!==b.id)throw Error('QR / Batch ID does not match this order');const r=num(o.recv,0,x.qty,'Received quantity');b.dp-=x.qty;b.dl+=r;b.av+=x.qty-r;x.recv=r;x.diff=+(x.qty-r).toFixed(2);x.status='Delivered';log(b,`Delivered ${r} t (diff ${x.diff} t)`);note('admin',`${id} received ${r} t, discrepancy ${x.diff} t`);note('plant:'+b.plant,`${id} delivered`);return 'Receipt confirmed'+(x.diff?' – discrepancy recorded':'')},
 finalize(id,o){g(['admin']);const x=Or(id),b=Ba(x.batch);if(x.status!=='Delivered')throw Error('Not delivered yet');const u=num(o.reused,0,x.recv,'Reused'),d=num(o.disposed,0,x.recv,'Disposed');if(+(u+d).toFixed(2)!==x.recv)throw Error('Reused + disposed must equal received ('+x.recv+' t)');b.dl-=x.recv;b.ru+=u;b.di+=d;x.ru=u;x.di=d;x.status='Closed';x.closed=new Date().toISOString();log(b,`Final: reused ${u} t, disposed ${d} t`);note('buyer:'+x.buyer,id+' closed');note('plant:'+b.plant,id+' closed');return 'Final utilization recorded'},
 reading(pid,o){g(['plant','admin'],pid);return AshAPI.ingestReading(pid,{loadcell_kg:o.load,ultrasonic_level_pct:o.level,temp_c:o.temp,dust_ugm3:o.dust},'MANUAL')},
 notify(o){g(['admin']);note(o.to,need(o.msg,'Message'));return 'Notification sent'},
 reset(){S=seed();return 'Demo data reset'}};
/* ---------- replaceable sensor layer: ESP32 will call ingestReading(plantId, payload, 'ESP32') ---------- */
const AshAPI=window.AshAPI={ingestReading(pid,r,src){const p=P(pid);const v={load:num(r.loadcell_kg,0,1e7,'Weight'),level:num(r.ultrasonic_level_pct,0,100,'Level'),temp:num(r.temp_c,-40,1000,'Temperature'),dust:num(r.dust_ugm3,0,1e5,'Dust')};
 Object.assign(p,v,{src,last:Date.now()});p.hist.unshift({t:new Date().toLocaleTimeString(),src,...v});p.hist.length=Math.min(p.hist.length,40);
 const al=[];if(v.level>=85)al.push('silo level '+v.level+'%');if(v.temp>=85)al.push('temperature '+v.temp+'°C');if(v.dust>=150)al.push('dust '+v.dust+' µg/m³');
 if(al.length){const m=`ALERT ${p.name}: ${al.join(', ')}`+(src==='DEMO'?' [DEMO]':'');note('plant:'+pid,m);note('admin',m)}return 'Reading recorded ('+src+')'}};
setInterval(()=>{if(!simOn||!sess||!sel)return;const p=P(sel);if(!p)return;const d=(x,a,lo,hi)=>Math.min(hi,Math.max(lo,x+(Math.random()-.4)*a));
 try{AshAPI.ingestReading(p.id,{loadcell_kg:d(p.load,40,0,5e4),ultrasonic_level_pct:d(p.level,3,0,100),temp_c:d(p.temp,4,20,120),dust_ugm3:d(p.dust,12,0,400)},'DEMO');save();if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#md').style.display.includes('flex'))render()}catch(e){}},4000);
/* ---------- views ---------- */
function loginV(){return`<header><h1>EcoAsh AI</h1><span class=mt>Smart Boiler Ash Management Platform</span></header><main style="max-width:760px;margin:auto">
<div class=pn><h2>Sign in (demo)</h2><p class=mt>Demo sign-in: roles are enforced in the data layer, but real passwords and a server database are needed for production. Sample data is stored in this browser only.</p>
<form onsubmit="return L(event)"><div class=row>${sel_('Role','role',['Thermal Plant','Waste Management Industry','Buyer'])}<label>Account<select name=id id=acc></select></label><button class=b>Enter</button></div></form></div>
<div class=pn><h3>Register a new buyer organization</h3><form onsubmit="return F(event,'registerBuyer')"><div class=row>${fld('Organization','org')}${fld('Contact email','contact','email')}<button class=b>Register</button></div></form><p class=mt>New buyers stay Pending until the administrator approves them.</p></div></main>`}
function L(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));sess=o.role==='Thermal Plant'?{role:'plant',id:o.id}:o.role==='Buyer'?{role:'buyer',id:o.id}:{role:'admin',id:'ADMIN'};tab='';sel=sess.role==='admin'?null:sess.id;cmp=[];render();return false}
function fillAcc(){const r=document.querySelector('[name=role]');if(!r)return;const a=$('#acc');const f=()=>{a.innerHTML=r.value==='Thermal Plant'?S.plants.map(p=>`<option value=${p.id}>${E(p.name)}</option>`).join(''):r.value==='Buyer'?S.buyers.map(b=>`<option value=${b.id}>${E(b.org)} (${b.status})</option>`).join(''):'<option value=ADMIN>Central Administrator</option>'};r.onchange=f;f()}
function render(){if(!sess){$('#app').innerHTML=loginV();fillAcc();return}
 const tb=TABS[sess.role];if(!tb.includes(tab)){tab=tb[0];sel=sess.role==='admin'?null:sess.id}
 const who=sess.role==='admin'?'Waste Management Industry – Control Centre':sess.role==='plant'?P(sess.id).name:Bu(sess.id).org;
 $('#app').innerHTML=`<header><h1>EcoAsh AI</h1><span class=mt>${E(who)}</span><span class=sp></span><button class="b s" onclick="B('reset')">Reset demo data</button><button class="b s" onclick="sess=null;render()">Sign out</button></header>
 <div class=wrap><nav>${tb.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';sel=${sess.role==='admin'?'null':`'${sess.id}'`};render()">${t}</button>`).join('')}</nav><main>${view()}</main></div>`}
function view(){const r=sess.role;
 if(r==='plant')return{Dashboard:()=>plantDash(sess.id),Batches:()=>batchesV(sess.id),Collections:()=>collV(sess.id),Notifications:()=>notesV('plant:'+sess.id)}[tab]();
 if(r==='buyer')return{'Profile & Needs':()=>buyerDash(sess.id),Marketplace:()=>marketV(sess.id),'My Orders':()=>`<h2>My orders and deliveries</h2>`+ordersT(S.orders.filter(o=>o.buyer===sess.id)),Notifications:()=>notesV('buyer:'+sess.id)}[tab]();
 return{Overview:adminOv,Plants:()=>sel?`<button class="b s" onclick="sel=null;render()">← All plants</button>`+plantDash(sel)+batchesV(sel)+collV(sel):plantsList(),Buyers:()=>sel?`<button class="b s" onclick="sel=null;render()">← All buyers</button>`+buyerDash(sel)+`<h3>Orders</h3>`+ordersT(S.orders.filter(o=>o.buyer===sel)):buyersList(),
 Batches:()=>batchesV(null),'Lab Verification':labV,'Marketplace & AI Match':()=>marketV(null)+matchV(),'Orders & Transport':()=>`<h2>Orders, pickup and final utilization</h2>`+ordersT(S.orders),Analytics:analytics,Notifications:()=>notesV('admin')+notifyForm()}[tab]()}
function adminOv(){const bt=S.batches,pend=bt.filter(b=>b.lab&&b.lab.status==='Submitted').length;const gen=sum(bt,'qty');
 return`<h2>Central overview</h2><div class=g>${C('Thermal plants',S.plants.length)}${C('Buyers',S.buyers.filter(b=>b.status==='Approved').length,'<small>+'+S.buyers.filter(b=>b.status==='Pending').length+' pending</small>')}${C('Ash generated (t)',n1(gen))}${C('Available (t)',n1(sum(bt,'av')))}${C('Reused (t)',n1(sum(bt,'ru')))}${C('Disposed (t)',n1(sum(bt,'di')))}${C('Pending lab checks',pend)}${C('Pending buyer requests',S.orders.filter(o=>o.status==='Requested').length)}${C('Active collections',S.orders.filter(o=>['Approved','Scheduled','Dispatched','Delivered'].includes(o.status)).length)}${C('Utilization',gen?Math.round(sum(bt,'ru')/gen*100)+'%':'0%')}</div>
 <h3>Latest notifications</h3>`+notesV('admin',5)}
function plantsList(){return`<h2>Thermal plant management</h2>`+T(['Plant','Location','Generated t','Available t','Reserved t','Sensors',''],S.plants.map(p=>{const b=S.batches.filter(x=>x.plant===p.id);return[E(p.name),E(p.loc),n1(sum(b,'qty')),n1(sum(b,'av')),n1(sum(b,'rs')),sensBd(p),`<button class=b onclick="sel='${p.id}';render()">Open dashboard</button>`]}))+`<h3>Register plant</h3><form onsubmit="return F(event,'registerPlant')"><div class=row>${fld('Name','name')}${fld('Location','loc')}${fld('Code (3–4 letters)','code','text','maxlength=4')}${fld('Silo capacity (t)','cap','number','min=1')}<button class=b>Register</button></div></form>`}
function buyersList(){return`<h2>Buyer management</h2>`+T(['Organization','Contact','Status','Monthly demand t','Orders',''],S.buyers.map(b=>[E(b.org),E(b.contact),sb(b.status),n1(sum(b.reqs,'qty')),S.orders.filter(o=>o.buyer===b.id).length,(b.status!=='Approved'?`<button class=b onclick="B('decideBuyer','${b.id}',true)">Approve</button> `:'')+(b.status!=='Rejected'?`<button class="b d" onclick="B('decideBuyer','${b.id}',false)">Reject</button> `:'')+`<button class="b s" onclick="sel='${b.id}';render()">Open</button>`]))}
const sensBd=p=>p.src==='none'?bd('Disconnected – no hardware'):p.src==='ESP32'?bd('ESP32 connected','ok'):`<span class=demo>${p.src==='DEMO'?'DEMO DATA':'MANUAL ENTRY'}</span>`;
function plantDash(pid){const p=P(pid),b=S.batches.filter(x=>x.plant===pid),o=S.orders.filter(x=>b.some(y=>y.id===x.batch));const ro=sess.role==='buyer';
 return`<h2>${E(p.name)} <span class=mt style="font-size:13px">${E(p.loc)}</span></h2><div class=g>${C('Ash generated (t)',n1(sum(b,'qty')))}${C('Available (t)',n1(sum(b,'av')))}${C('Reserved (t)',n1(sum(b,'rs')))}${C('Dispatched (t)',n1(sum(b,'dp')))}${C('Delivered (t)',n1(sum(b,'dl')))}${C('Reused (t)',n1(sum(b,'ru')))}${C('Pending collections',o.filter(x=>['Approved','Scheduled'].includes(x.status)).length)}</div>
 <div class=pn><h3 style="margin-top:0">Storage and sensors ${sensBd(p)}</h3><div class=g>${C('Silo level',n1(p.level)+'%','<div class=bar><i style="width:'+p.level+'%"></i></div>')}${C('Silo stock (t)',n1(p.level*p.cap/100),'<small>of '+n1(p.cap)+' t</small>')}${C('Ash weight (kg)',n1(p.load))}${C('Temperature °C',n1(p.temp))}${C('Dust µg/m³',n1(p.dust))}</div>
 <p class=mt>Last reading: ${p.last?new Date(p.last).toLocaleString():'none'}. Values shown are not from real hardware until the status reads “ESP32 connected”.</p>
 <form onsubmit="return F(event,'reading','${pid}')"><div class=row>${fld('Weight kg','load','number','step=any min=0 value='+p.load)}${fld('Level %','level','number','step=any min=0 max=100 value='+p.level)}${fld('Temp °C','temp','number','step=any value='+p.temp)}${fld('Dust µg/m³','dust','number','step=any min=0 value='+p.dust)}<button class=b>Save manual reading</button><button type=button class="b s" onclick="sel='${pid}';simOn=!simOn;toast(simOn?'DEMO simulation on':'Simulation off');render()">${simOn?'Stop':'Start'} DEMO simulation</button></div></form>
 ${T(['Time','Source','Weight','Level %','Temp','Dust'],p.hist.slice(0,5).map(h=>[h.t,h.src,n1(h.load),n1(h.level),n1(h.temp),n1(h.dust)]))}
 <details><summary>ESP32 integration contract (next round)</summary><pre>POST /api/v1/plants/${p.id}/readings
x-device-key: &lt;per-plant secret&gt;
{"loadcell_kg":0,"ultrasonic_level_pct":0,"temp_c":0,"dust_ugm3":0}</pre>This demo has no server. AshAPI.ingestReading(plantId, payload, 'ESP32') is the single swap point: the endpoint handler will call the same validation, history and alert logic.</details></div>`}
function batchesV(pid){const b=S.batches.filter(x=>!pid||x.plant===pid);const q=window._q||'';
 const own=sess.role==='plant'||(sess.role==='admin'&&pid);
 return`<h2>Ash batches</h2>`+(own?`<form onsubmit="return F(event,'createBatch','${pid}')"><div class=row>${sel_('Ash type','type',['Fly Ash','Bottom Ash'])}${fld('Quantity (t)','qty','number','step=any min=0.1')}${fld('Generation date','date','date')}${fld('Storage location','store')}<button class=b>Create batch + QR</button></div></form>`:`<div class=row><label>Search Batch ID<input value="${E(q)}" onchange="window._q=this.value;render()" placeholder="ASH-…"></label><label>Plant<select onchange="window._pf=this.value;render()"><option value="">All</option>${S.plants.map(p=>`<option value=${p.id} ${window._pf===p.id?'selected':''}>${E(p.name)}</option>`).join('')}</select></label><label>Type<select onchange="window._tf=this.value;render()"><option value="">All</option><option ${window._tf==='Fly Ash'?'selected':''}>Fly Ash</option><option ${window._tf==='Bottom Ash'?'selected':''}>Bottom Ash</option></select></label></div>`)+
 T(['Batch ID','Plant','Type','Qty t','Avail','Rsrv','Disp','Deliv','Reused','Lab',''],b.filter(x=>!q||x.id.toLowerCase().includes(q.toLowerCase())).filter(x=>pid||!window._pf||x.plant===window._pf).filter(x=>pid||!window._tf||x.type===window._tf).map(x=>[`<a href=# style="color:var(--gr)" onclick="pass('${x.id}');return false">${x.id}</a>`,E(P(x.plant).code),x.type,n1(x.qty),n1(x.av),n1(x.rs),n1(x.dp),n1(x.dl),n1(x.ru),sb(x.lab?x.lab.status:'No report'),`<button class="b s" onclick="pass('${x.id}')">Passport</button>`+(own&&(!x.lab||x.lab.status!=='Approved')?` <button class=b onclick="labForm('${x.id}')">${x.lab?'Resubmit':'Add'} lab</button>`:'')]))}
function pass(id){const b=Ba(id),p=P(b.plant);md(`<h2>Digital Ash Passport</h2><div class=row><div id=qr></div><div><b>${b.id}</b><br>${E(p.name)}, ${E(p.loc)}<br>${b.type} · ${n1(b.qty)} t · generated ${b.date}<br>Storage: ${E(b.store)}<br>Lab: ${sb(b.lab?b.lab.status:'No report')}<br><small class=mt>QR payload: ECOASH|${b.id}</small></div></div>
 ${b.lab?T(['SiO2','Al2O3','Fe2O3','CaO','LOI','Moisture'],[[b.lab.si,b.lab.al,b.lab.fe,b.lab.ca,b.lab.loi,b.lab.mo]])+(b.lab.remark?`<p>Remarks: ${E(b.lab.remark)}</p>`:''):'<p class=mt>No lab report linked.</p>'}
 <p>Available ${n1(b.av)} · Reserved ${n1(b.rs)} · Dispatched ${n1(b.dp)} · Delivered ${n1(b.dl)} · Reused ${n1(b.ru)} · Disposed ${n1(b.di)} t</p><h3>Movement history</h3>${T(['When','Event'],b.hist.map(h=>[h.t,E(h.e)]))}
 <div class=row>${b.lab&&b.lab.status==='Approved'?`<button class=b onclick="cert('${b.id}')">Download certificate</button>`:''}<button class="b s" onclick="md()">Close</button></div>`);
 setTimeout(()=>{const q=$('#qr');if(window.QRCode)new QRCode(q,{text:'ECOASH|'+b.id,width:130,height:130});else q.textContent='QR library unavailable offline'},0)}
function cert(id){const b=Ba(id),p=P(b.plant),l=b.lab;dl(id+'-certificate.html',`<h1>EcoAsh Quality Certificate</h1><p>Batch ${id} – ${b.type}, ${b.qty} t<br>${E(p.name)}, ${E(p.loc)}</p><table border=1 cellpadding=6><tr><th>SiO2</th><th>Al2O3</th><th>Fe2O3</th><th>CaO</th><th>LOI</th><th>Moisture</th></tr><tr><td>${l.si}</td><td>${l.al}</td><td>${l.fe}</td><td>${l.ca}</td><td>${l.loi}</td><td>${l.mo}</td></tr></table><p>Status: ${l.status}. Remarks: ${E(l.remark)}</p>`,'text/html')}
function md(h){const m=$('#md');if(!h){m.style.display='none';return}m.innerHTML='<div class=in>'+h+'</div>';m.style.display='flex'}
function labForm(id){md(`<h2>Laboratory report – ${id}</h2><form onsubmit="md();return F(event,'submitLab','${id}')"><div class=row>${['si:SiO2 %','al:Al2O3 %','fe:Fe2O3 %','ca:CaO %','loi:LOI %','mo:Moisture %'].map(x=>{const[k,l]=x.split(':');return fld(l,k,'number','step=any min=0 max=100')}).join('')}</div><label class=mt>Report file (name is recorded; file itself is not stored in this demo)<input type=file name=file_ x onchange="this.form.file.value=this.files[0]?this.files[0].name:''"></label><input type=hidden name=file><div class=row><button class=b>Submit report</button><button type=button class="b s" onclick="md()">Cancel</button></div></form>`)}
function collV(pid){return`<h2>Collections and dispatch</h2>`+ordersT(S.orders.filter(o=>Ba(o.batch).plant===pid))}
function ordersT(list){const r=sess.role;return T(['Order','Batch','Buyer','Qty t','Status','Details','Actions'],list.map(o=>{const b=Ba(o.batch);let a='';
 if(r==='admin'&&o.status==='Requested')a=`<button class=b onclick="B('decideOrder','${o.id}',true)">Approve</button> <button class="b d" onclick="B('decideOrder','${o.id}',false)">Reject</button>`;
 if(r==='admin'&&o.status==='Approved')a=`<form onsubmit="return F(event,'schedule','${o.id}')"><div class=row><input name=transporter placeholder="Transporter" required><input name=vehicle placeholder="Vehicle no."><input name=pickup type=date required><button class=b>Schedule</button></div></form>`;
 if((r==='plant'||r==='admin')&&o.status==='Scheduled')a=`<button class=b onclick="B('dispatch','${o.id}')">Confirm dispatch</button>`;
 if(r==='buyer'&&o.status==='Dispatched')a=`<form onsubmit="return F(event,'receive','${o.id}')"><div class=row><input name=qr placeholder="Scan/enter QR or Batch ID" required><input name=recv type=number step=any min=0 max=${o.qty} placeholder="Received t" required><button class=b>Confirm receipt</button></div></form>`;
 if(r==='admin'&&o.status==='Delivered')a=`<form onsubmit="return F(event,'finalize','${o.id}')"><div class=row><input name=reused type=number step=any min=0 placeholder="Reused t" required><input name=disposed type=number step=any min=0 placeholder="Disposed t" required><button class=b>Close order</button></div></form>`;
 const d=[o.pickup?`Pickup ${o.pickup}, ${E(o.transporter)} ${E(o.vehicle)}`:'',o.recv!=null?`Received ${o.recv} t (diff ${o.diff})`:'',o.status==='Closed'?`Reused ${o.ru} / disposed ${o.di} t`:''].filter(Boolean).join('<br>');
 return[o.id,`<a href=# style="color:var(--gr)" onclick="pass('${b.id}');return false">${b.id}</a>`,E(Bu(o.buyer).org),n1(o.qty),sb(o.status),d,a]}))}
function buyerDash(id){const b=Bu(id),o=S.orders.filter(x=>x.buyer===id),own=sess.role==='buyer'||sess.role==='admin';
 return`<h2>${E(b.org)} ${sb(b.status)}</h2><p class=mt>${E(b.contact)}</p><div class=g>${C('Monthly demand (t)',n1(sum(b.reqs,'qty')))}${C('Orders',o.length)}${C('Pending',o.filter(x=>x.status==='Requested').length)}${C('Received (t)',n1(sum(o,'recv')))}</div>
 <h3>Ash requirements</h3>${T(['Type','Application','Qty t / month','Max LOI %','Min SiO2 %'],b.reqs.map(r=>[r.type,r.app,n1(r.qty),r.maxLOI,r.minSi]))}
 ${own&&b.status==='Approved'?`<form onsubmit="return F(event,'addReq','${id}')"><div class=row>${sel_('Ash type','type',['Fly Ash','Bottom Ash'])}${sel_('Application','app',Object.keys(APPS))}${fld('Monthly qty (t)','qty','number','min=1 step=any')}${fld('Max LOI %','maxLOI','number','step=any min=0 max=100')}${fld('Min SiO2 %','minSi','number','step=any min=0 max=100')}<button class=b>Add requirement</button></div></form>`:'<p class=mt>Requirements can be added once registration is approved.</p>'}`}
function marketV(bid){const bu=bid?Bu(bid):null;const L=S.batches.filter(b=>b.lab&&b.lab.status==='Approved'&&b.av>0);
 const best=b=>{if(!bu)return null;return bu.reqs.map(r=>match(b,r)).filter(Boolean).sort((a,c)=>c.score-a.score)[0]};
 return`<h2>Digital ash marketplace</h2><p class=mt>Only lab-verified batches with stock are listed. Match scores are potential matches based on reported lab data, not guarantees.</p>`+
 T(['','Batch','Plant','Type','Available t','SiO2 / LOI / Moist','Potential match',bu?'Request':''],L.map(b=>{const m=best(b);return[`<input type=checkbox ${cmp.includes(b.id)?'checked':''} onchange="cmpT('${b.id}')">`,`<a href=# style="color:var(--gr)" onclick="pass('${b.id}');return false">${b.id}</a>`,E(P(b.plant).name),b.type,n1(b.av),`${b.lab.si} / ${b.lab.loi} / ${b.lab.mo}`,m?`${bd(m.score+'%',m.score>=75?'ok':'wa')}<details><summary>why</summary>${m.why.map(w=>(w[1]?'✓ ':'✗ ')+E(w[0])).join('<br>')}</details>`:'<span class=mt>Add a requirement</span>',bu&&bu.status==='Approved'?`<form onsubmit="return F(event,'placeOrder','${bid}')"><div class=row><input type=hidden name=batch value="${b.id}"><input name=qty type=number step=any min=0.1 max=${b.av} placeholder="t" style="width:70px" required><button class=b>Request</button></div></form>`:''].slice(0,bu?8:7)}))+
 (cmp.length>1?`<h3>Batch comparison</h3>`+T(['Batch','Type','SiO2','Al2O3','Fe2O3','CaO','LOI','Moisture','Avail t'],cmp.map(Ba).map(b=>[b.id,b.type,b.lab.si,b.lab.al,b.lab.fe,b.lab.ca,b.lab.loi,b.lab.mo,n1(b.av)])):'<p class=mt>Tick two or more batches to compare.</p>')}
const cmpT=id=>{cmp=cmp.includes(id)?cmp.filter(x=>x!==id):[...cmp,id];render()};
function matchV(){const rows=[];S.buyers.filter(b=>b.status==='Approved').forEach(b=>b.reqs.forEach(r=>S.batches.forEach(x=>{const m=match(x,r);if(m)rows.push([b.org,r.app+' ('+r.type+')',x.id,m.score,m.verified])})));rows.sort((a,b)=>b[3]-a[3]);
 return`<h3>AI potential-match recommendations (buyer needs × batches)</h3>`+T(['Buyer','Requirement','Batch','Match','Basis'],rows.slice(0,15).map(r=>[E(r[0]),E(r[1]),r[2],r[3]+'%',r[4]?bd('Verified lab','ok'):bd('POTENTIAL – lab unverified','wa')]))}
function labV(){const L=S.batches.filter(b=>b.lab);return`<h2>Laboratory verification</h2>`+T(['Batch','Plant','SiO2','Al2O3','Fe2O3','CaO','LOI','Moist.','File','Status','Decision'],L.map(b=>{const l=b.lab;return[b.id,E(P(b.plant).code),l.si,l.al,l.fe,l.ca,l.loi,l.mo,E(l.file||'–'),sb(l.status)+(l.remark?'<br><small>'+E(l.remark)+'</small>':''),l.status==='Submitted'?`<form onsubmit="return F(event,'verifyLab','${b.id}',this.ok.value==='1')"><div class=row><input name=remark placeholder="Remarks"><select name=ok><option value=1>Approve</option><option value=0>Reject</option></select><button class=b>Save</button></div></form>`:(l.status==='Approved'?`<button class="b s" onclick="cert('${b.id}')">Certificate</button>`:'')]}))}
function analytics(){const bt=S.batches,mo={};S.orders.filter(o=>o.status==='Closed').forEach(o=>{const k=o.closed.slice(0,7);mo[k]=mo[k]||[0,0];mo[k][0]+=o.ru;mo[k][1]+=o.di});const mx=Math.max(1,...S.plants.map(p=>sum(bt.filter(b=>b.plant===p.id),'qty')));
 return`<h2>Analytics and reports</h2><div class="row noprint"><button class=b onclick="exp()">Download CSV</button><button class="b s" onclick="print()">Print / save as PDF</button></div>
 <h3>Plant-wise generation (t)</h3>${S.plants.map(p=>{const v=sum(bt.filter(b=>b.plant===p.id),'qty');return`<div>${E(p.name)} – ${n1(v)}<div class=bar><i style="width:${v/mx*100}%"></i></div></div>`}).join('')}
 <h3>Reused vs disposed</h3><p>Reused ${n1(sum(bt,'ru'))} t · Disposed ${n1(sum(bt,'di'))} t</p><h3>Monthly utilization</h3>${T(['Month','Reused t','Disposed t'],Object.entries(mo).map(([k,v])=>[k,n1(v[0]),n1(v[1])]))}
 <h3>Buyer-wise demand and receipts</h3>${T(['Buyer','Demand t/month','Ordered t','Received t'],S.buyers.map(b=>{const o=S.orders.filter(x=>x.buyer===b.id);return[E(b.org),n1(sum(b.reqs,'qty')),n1(sum(o,'qty')),n1(sum(o,'recv'))]}))}
 <h3>Transport</h3>${T(['Order','Transporter','Pickup','Status','Diff t'],S.orders.filter(o=>o.transporter).map(o=>[o.id,E(o.transporter),o.pickup,o.status,o.diff??'–']))}
 <h3>Lab quality</h3>${T(['Batch','SiO2','LOI','Status'],bt.filter(b=>b.lab).map(b=>[b.id,b.lab.si,b.lab.loi,b.lab.status]))}`}
function exp(){csv('ecoash-batches.csv',[['Batch','Plant','Type','Qty','Available','Reserved','Dispatched','Delivered','Reused','Disposed','Lab']].concat(S.batches.map(b=>[b.id,P(b.plant).name,b.type,b.qty,b.av,b.rs,b.dp,b.dl,b.ru,b.di,b.lab?b.lab.status:'none'])))}
function notesV(to,lim){const L=S.notes.filter(n=>n.to===to).slice(0,lim||50);return(lim?'':'<h2>Notifications</h2>')+T(['Time','Message'],L.map(n=>[new Date(n.t).toLocaleString(),E(n.msg)]))}
function notifyForm(){return`<h3>Send notification</h3><form onsubmit="return F(event,'notify')"><div class=row><label>To<select name=to>${S.plants.map(p=>`<option value="plant:${p.id}">${E(p.name)}</option>`).join('')}${S.buyers.map(b=>`<option value="buyer:${b.id}">${E(b.org)}</option>`).join('')}</select></label>${fld('Message','msg','text','style="min-width:260px"')}<button class=b>Send</button></div></form>`}
render();
</script></body></html>
